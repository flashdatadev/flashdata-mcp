name: Official MCP Registry

on:
  push:
    paths:
      - 'registry/**'
      - '.github/workflows/mcp-registry.yml'
  pull_request:
    paths:
      - 'registry/**'
      - '.github/workflows/mcp-registry.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Publish all 15 task entries or the combined hosted entry'
        type: choice
        options:
          - tasks
          - hosted
        default: tasks
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1'
      - name: Validate all manifests and publication safety
        run: |
          python registry/manage.py validate
          python -m unittest discover -s registry -p 'test_manage.py'

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: official-mcp-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' \
            --output mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        working-directory: ${{ runner.temp }}
        run: ./mcp-publisher login github-oidc
      - name: Publish and read back immutable versions
        working-directory: ${{ runner.temp }}
        env:
          REGISTRY_SCOPE: ${{ inputs.scope }}
        run: |
          python "$GITHUB_WORKSPACE/registry/manage.py" publish \
            --scope "$REGISTRY_SCOPE" --publisher "$RUNNER_TEMP/mcp-publisher" \
            --output "$RUNNER_TEMP/registry-receipts"

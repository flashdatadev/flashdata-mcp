name: MCP package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - run: npm run check:claude-plugin
      - run: npm run test:install
      - run: npm run build:smithery
      - run: node --test test/task-servers.test.js
        env:
          FLASHDATA_TASK_BUNDLE_DIR: dist/smithery
      - run: npm audit --audit-level=high
      - run: npm pack

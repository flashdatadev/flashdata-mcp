name: Publish Python task CLIs
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Choose a project, or all 15. Run only on a python-cli-vVERSION tag.'
        type: choice
        required: true
        options:
          - flashdata-google-search
          - flashdata-google-news
          - flashdata-google-images
          - flashdata-google-shopping
          - flashdata-google-videos
          - flashdata-google-places
          - flashdata-youtube-search
          - flashdata-youtube-search-extended
          - flashdata-youtube-metadata
          - flashdata-youtube-transcript
          - flashdata-youtube-captions
          - flashdata-youtube-trainability
          - flashdata-youtube-channel
          - flashdata-youtube-suggestions
          - flashdata-youtube-cloud-storage
          - all
permissions:
  contents: read
concurrency:
  group: python-cli-pypi-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'rocosen/flashdata-mcp' && github.ref_type == 'tag' && startsWith(github.ref_name, 'python-cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/python-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Verify release tag and selected project
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISH_PROJECT: ${{ inputs.project }}
        run: |
          uv run --frozen python - <<'PY'
          import json, os
          from pathlib import Path
          packages = json.loads(Path('packages.json').read_text())
          assert len(packages) == 15
          assert all(os.environ['RELEASE_TAG'] == 'python-cli-v' + p['version'] for p in packages)
          assert os.environ['PUBLISH_PROJECT'] in ['all', *(p['project'] for p in packages)]
          PY
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check src scripts tests
      - run: uv run --frozen ruff format --check src scripts tests
      - run: uv run --frozen python scripts/build.py
      - run: uv run --frozen python scripts/verify_install.py
      - name: Select checked distributions
        env:
          PUBLISH_PROJECT: ${{ inputs.project }}
        run: |
          uv run --frozen python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          target = Path('publish-dist')
          target.mkdir()
          builds = json.loads(Path('evidence/builds.json').read_text())
          for build in builds:
              if os.environ['PUBLISH_PROJECT'] in ('all', build['project']):
                  for artifact in build['artifacts']:
                      shutil.copy2(Path('dist') / artifact['filename'], target)
          assert len(list(target.iterdir())) == (30 if os.environ['PUBLISH_PROJECT'] == 'all' else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-cli-distributions
          path: packages/python-cli/publish-dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-python-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-cli-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0

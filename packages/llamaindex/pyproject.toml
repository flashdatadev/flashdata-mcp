[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-flashdata"
version = "0.1.0"
description = "Google and YouTube search tools and citation-aware readers for LlamaIndex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FlashData"}]
dependencies = ["llama-index-core>=0.14.25,<0.15", "httpx>=0.28.1,<1", "pydantic>=2.7.4,<3", "jsonschema>=4.23,<5"]
keywords = ["llamaindex", "google-search", "youtube-transcript", "agent", "rag"]

[project.urls]
Homepage = "https://flashdata.dev"
Documentation = "https://github.com/rocosen/flashdata-mcp/tree/main/packages/llamaindex"
Source = "https://github.com/rocosen/flashdata-mcp"
Issues = "https://github.com/rocosen/flashdata-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
exclude = ["src/llama_index/tools/flashdata/_client.py", "src/llama_index/tools/flashdata/_inputs.py", "src/llama_index/tools/flashdata/_storage.py"]

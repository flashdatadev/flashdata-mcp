[project]
name = "flashdata-cli-builder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1", "pydantic>=2.7.4,<3", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "hatchling>=1.27,<2", "build>=1.2,<2", "twine>=6,<8", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--disable-socket"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
